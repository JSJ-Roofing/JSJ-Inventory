<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>JSJ Roofing — Stock Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
:root {
  --green: #a2c354;
  --green-dark: #91b343;
  --green-darker: #82a33a;
  --green-bg: #f4f8ea;
  --blue: #0654a6;
  --cyan: #0088cf;
  --dark-blue: #082b51;
  --black: #231f20;
  --white: #ffffff;
  --surface: #f7f8f5;
  --surface-2: #eef0e8;
  --text: #231f20;
  --text-2: #5a5a5a;
  --text-3: #8a8a8a;
  --success: #a2c354;
  --success-bg: #f4f8ea;
  --warning: #e8a317;
  --warning-bg: #fef7e6;
  --danger: #d63031;
  --danger-bg: #fdeaea;
  --info: #0088cf;
  --info-bg: #e6f4fb;
  --border: #e2e4dc;
  --border-med: #c5c8bc;
  --radius-sm: 4px;
  --radius: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 9999px;
  --shadow-1: 0 1px 3px rgba(35,31,32,0.06);
  --shadow-2: 0 4px 12px rgba(35,31,32,0.08);
  --shadow-3: 0 8px 24px rgba(35,31,32,0.12);
  --shadow-4: 0 16px 48px rgba(35,31,32,0.16);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow',sans-serif;background:var(--surface);color:var(--text);min-height:100vh;font-size:16px;line-height:1.5;}

/* ── HEADER ── */
.header{background:var(--dark-blue);padding:0 20px;display:flex;align-items:center;gap:16px;height:68px;box-shadow:var(--shadow-3);position:sticky;top:0;z-index:100;}
.logo-wrap{display:flex;align-items:center;gap:12px;}
.logo-img{height:44px;width:auto;}
.logo-divider{width:1px;height:32px;background:rgba(255,255,255,0.15);}
.logo-text{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:rgba(255,255,255,0.9);letter-spacing:0.5px;line-height:1.2;}
.logo-sub{font-size:11px;font-weight:600;color:var(--green);letter-spacing:1px;text-transform:uppercase;}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px;}

/* ── APP WRAP ── */
.app{max-width:720px;margin:0 auto;padding:20px 16px 60px;}

/* ── STAFF LOGIN ── */
.staff-screen{text-align:center;padding:48px 20px 32px;}
.staff-screen h2{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;color:var(--dark-blue);margin-bottom:6px;letter-spacing:-0.3px;}
.staff-screen p{color:var(--text-2);font-size:15px;margin-bottom:28px;}
.staff-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:420px;margin:0 auto 28px;}
.staff-btn{padding:16px 14px;border-radius:var(--radius-lg);border:2px solid var(--border);background:var(--white);cursor:pointer;font-size:15px;font-weight:600;color:var(--text);font-family:'Barlow',sans-serif;transition:all 0.18s;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-1);}
.staff-btn:hover{border-color:var(--green);background:var(--green-bg);color:var(--dark-blue);box-shadow:var(--shadow-2);transform:translateY(-1px);}
.staff-btn i{font-size:20px;color:var(--text-3);}
.staff-btn:hover i{color:var(--green-dark);}

/* ── STAFF BANNER ── */
.staff-banner{background:var(--dark-blue);border-radius:var(--radius-lg);padding:10px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.staff-banner .name{color:white;font-weight:700;font-size:15px;}
.staff-banner .logout-btn{margin-left:auto;background:rgba(255,255,255,0.12);border:1.5px solid rgba(255,255,255,0.25);color:white;border-radius:var(--radius);padding:5px 12px;cursor:pointer;font-size:12px;font-family:'Barlow',sans-serif;font-weight:700;letter-spacing:0.3px;transition:all 0.15s;}
.staff-banner .logout-btn:hover{background:rgba(255,255,255,0.2);}

/* ── TABS ── */
.tabs{display:flex;gap:8px;margin-bottom:20px;}
.tab-btn{flex:1;padding:11px 10px;border-radius:var(--radius-lg);border:2px solid var(--border);background:var(--white);color:var(--text-2);cursor:pointer;font-family:'Barlow',sans-serif;font-size:14px;font-weight:700;transition:all 0.18s;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:var(--shadow-1);}
.tab-btn.active{background:var(--dark-blue);color:white;border-color:var(--dark-blue);box-shadow:var(--shadow-2);}
.tab-btn.active i{color:var(--green);}
.tab-btn:hover:not(.active){background:var(--green-bg);border-color:var(--green);color:var(--dark-blue);}
.view{display:none;}.view.active{display:block;}

/* ── SEARCH ── */
.search-wrap{position:relative;margin-bottom:14px;}
.search-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:18px;}
.search-wrap input{padding-left:40px;}

/* ── CARDS ── */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-xl);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-1);}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;color:var(--text-2);margin-bottom:16px;display:flex;align-items:center;gap:8px;text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:12px;}
.card-title i{color:var(--green);font-size:16px;}

/* ── FORMS ── */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.form-row.full{grid-template-columns:1fr;}
label{font-size:12px;color:var(--text);display:block;margin-bottom:5px;font-weight:700;letter-spacing:0.3px;text-transform:uppercase;}
input,select{width:100%;padding:10px 14px;background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius);font-size:14px;color:var(--text);font-family:'Barlow',sans-serif;transition:border-color 0.15s,box-shadow 0.15s;}
input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(6,84,166,0.1);}
input::placeholder{color:var(--text-3);}

/* ── BUTTONS ── */
.btn{padding:10px 18px;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--white);cursor:pointer;font-size:14px;font-weight:700;color:var(--text-2);font-family:'Barlow',sans-serif;transition:all 0.18s;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow-1);}
.btn:hover{background:var(--surface);transform:translateY(-1px);box-shadow:var(--shadow-2);}
.btn.primary{background:var(--green);color:var(--dark-blue);border-color:var(--green);}
.btn.primary:hover{background:var(--green-dark);box-shadow:0 4px 12px rgba(162,195,84,0.35);transform:translateY(-1px);}
.btn.primary:active{background:var(--green-darker);transform:translateY(0);}
.btn.success{background:var(--green);color:var(--dark-blue);border-color:var(--green);}
.btn.success:hover{background:var(--green-dark);}
.btn.danger{background:var(--danger);color:white;border-color:var(--danger);}
.btn.danger:hover{background:#c0282a;}
.btn.clone{background:var(--info-bg);color:var(--cyan);border-color:#b3ddf0;}
.btn.sm{padding:6px 12px;font-size:12px;}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

/* ── MATERIAL LIST ── */
.mat-list{display:flex;flex-direction:column;gap:10px;}
.mat-item{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;transition:all 0.18s;box-shadow:var(--shadow-1);}
.mat-item:hover{border-color:var(--green);box-shadow:var(--shadow-2);transform:translateY(-1px);}
.mat-item.drag-over{border-color:var(--green);border-style:dashed;background:var(--green-bg);transform:translateY(-2px);box-shadow:var(--shadow-3);}
.mat-thumb{width:52px;height:52px;border-radius:var(--radius-lg);object-fit:cover;border:1.5px solid var(--border);flex-shrink:0;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:22px;overflow:hidden;}
.mat-thumb img{width:100%;height:100%;object-fit:cover;}
.mat-name{font-size:15px;font-weight:700;color:var(--dark-blue);}
.mat-meta{font-size:12px;color:var(--text-3);margin-top:2px;font-weight:500;}
.color-dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.cdot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(0,0,0,0.1);position:relative;cursor:pointer;flex-shrink:0;}
.cdot:hover::after{content:attr(data-tip);position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:var(--dark-blue);color:white;font-size:11px;padding:4px 8px;border-radius:4px;white-space:nowrap;z-index:10;font-family:'Barlow',sans-serif;font-weight:600;}
.stock-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:var(--radius-full);white-space:nowrap;flex-shrink:0;letter-spacing:0.4px;text-transform:uppercase;}
.pill-ok{background:var(--success-bg);color:#4a7a1a;}
.pill-low{background:var(--warning-bg);color:#8a5a00;}
.pill-zero{background:var(--danger-bg);color:var(--danger);}
.item-btns{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}

/* ── JOB BANNER ── */
.job-banner{background:var(--dark-blue);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;border-left:4px solid var(--green);}
.job-icon{color:var(--green);font-size:24px;flex-shrink:0;}
.job-banner strong{color:white;font-size:16px;font-weight:700;}
.job-banner small{color:rgba(255,255,255,0.6);font-size:12px;display:block;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px;}
.job-banner .change-btn{margin-left:auto;background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.2);color:white;border-radius:var(--radius);padding:6px 14px;cursor:pointer;font-size:12px;font-family:'Barlow',sans-serif;font-weight:700;white-space:nowrap;transition:all 0.15s;letter-spacing:0.3px;}
.job-banner .change-btn:hover{background:rgba(255,255,255,0.2);}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
.stat{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:16px;text-align:center;box-shadow:var(--shadow-1);}
.stat-n{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;color:var(--dark-blue);letter-spacing:-0.5px;}
.stat-n.green{color:var(--green-dark);}
.stat-n.red{color:var(--danger);}
.stat-n.warn{color:var(--warning);}
.stat-l{font-size:11px;color:var(--text-3);margin-top:2px;text-transform:uppercase;letter-spacing:0.5px;font-weight:700;}

/* ── COLOUR ROWS ── */
.color-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.color-row input[type=color]{width:36px;height:36px;padding:2px;border-radius:50%;cursor:pointer;border:2px solid var(--border);flex-shrink:0;background:transparent;}
.color-row input[type=text]{flex:1;}
.color-row input[type=number]{width:72px;}
.rm-btn{background:none;border:none;color:var(--danger);font-size:20px;cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0;}

/* ── PHOTO UPLOAD ── */
.photo-upload{border:2px dashed var(--border);border-radius:var(--radius-lg);padding:18px;text-align:center;cursor:pointer;transition:all 0.18s;margin-bottom:10px;}
.photo-upload:hover{border-color:var(--green);background:var(--green-bg);}
.photo-upload i{font-size:30px;color:var(--text-3);display:block;margin-bottom:6px;}
.photo-upload p{font-size:13px;color:var(--text-3);}
.photo-preview{width:100%;max-height:160px;object-fit:cover;border-radius:var(--radius-lg);margin-top:10px;display:none;}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(8,43,81,0.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px);}
.modal{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-xl);padding:24px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-4);}
.modal h2{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;color:var(--dark-blue);margin-bottom:18px;display:flex;align-items:center;gap:8px;}
.modal h2 i{color:var(--green);}
.modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;}

/* ── DETAIL MODAL ── */
.detail-name{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;color:var(--dark-blue);letter-spacing:-0.3px;}
.detail-sku{font-size:12px;color:var(--text-3);margin:4px 0 16px;font-family:monospace;background:var(--surface);display:inline-block;padding:2px 8px;border-radius:var(--radius-sm);}
.detail-photo{width:100%;max-height:200px;object-fit:cover;border-radius:var(--radius-lg);margin-bottom:16px;}
.cstock-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border);}
.cstock-row:last-of-type{border-bottom:none;}
.cswatch{display:flex;align-items:center;gap:10px;}
.cswatch-dot{width:26px;height:26px;border-radius:50%;border:2px solid rgba(0,0,0,0.1);flex-shrink:0;}
.cname{font-size:14px;font-weight:700;color:var(--text);}
.cqty-label{font-size:12px;color:var(--text-3);margin-top:1px;}
.cactions{display:flex;flex-direction:column;align-items:flex-end;gap:7px;}
.cbtns{display:flex;gap:6px;}
.qty-row{display:flex;align-items:center;gap:6px;}
.qty-row label{font-size:11px;margin:0;text-transform:none;}
.qty-row input{width:60px;padding:5px 8px;font-size:13px;}

/* ── QR ── */
.qr-print-wrap{text-align:center;}
.qr-print-wrap .print-photo{width:160px;height:120px;object-fit:cover;border-radius:var(--radius-lg);margin:10px auto;display:block;border:1.5px solid var(--border);}
#qrcode-container canvas{display:block;margin:0 auto;border-radius:var(--radius-lg);}

/* ── TRANSACTIONS ── */
.tx-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
.tx-row:last-child{border-bottom:none;}
.tx-icon{font-size:18px;flex-shrink:0;}
.tx-icon.out{color:var(--danger);}
.tx-icon.in{color:var(--green-dark);}
.tx-info{flex:1;min-width:0;}
.tx-mat{font-weight:700;color:var(--dark-blue);}
.tx-col{color:var(--text-3);}
.tx-tag{display:inline-block;background:var(--info-bg);color:var(--cyan);font-size:10px;padding:2px 8px;border-radius:var(--radius-full);font-weight:700;margin-top:2px;margin-right:3px;}
.tx-tag.staff{background:var(--green-bg);color:#4a7a1a;}
.tx-qty{font-weight:700;white-space:nowrap;}
.tx-qty.out{color:var(--danger);}
.tx-qty.in{color:var(--green-dark);}
.tx-time{font-size:11px;color:var(--text-3);white-space:nowrap;}

/* ── STAFF TAGS ── */
.staff-tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.staff-tag{display:inline-flex;align-items:center;gap:6px;background:var(--info-bg);color:var(--blue);border-radius:var(--radius-full);padding:5px 12px;font-size:13px;font-weight:700;border:1px solid #b3ddf0;}
.staff-tag button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;padding:0;line-height:1;}

/* ── MISC ── */
.no-items{text-align:center;padding:32px;color:var(--text-3);font-size:14px;}
.hidden{display:none!important;}
.warn-box{background:var(--warning-bg);border:1px solid #f5cc6a;border-left:4px solid var(--warning);border-radius:var(--radius-lg);padding:12px 14px;font-size:13px;color:#6b4300;display:flex;gap:8px;align-items:flex-start;margin-bottom:14px;}
.warn-box i{color:var(--warning);flex-shrink:0;margin-top:1px;}
.info-box{background:var(--info-bg);border:1px solid #90cfe8;border-left:4px solid var(--cyan);border-radius:var(--radius-lg);padding:12px 14px;font-size:13px;color:#004f7a;display:flex;gap:8px;margin-bottom:14px;}
.info-box i{color:var(--cyan);flex-shrink:0;margin-top:1px;}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0;}

/* ── LOADING ── */
#loading-overlay{position:fixed;inset:0;background:var(--dark-blue);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
.spinner{width:44px;height:44px;border:4px solid rgba(162,195,84,0.3);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-logo{height:56px;width:auto;opacity:0.95;}
.loading-text{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:rgba(255,255,255,0.7);letter-spacing:1px;}
.loading-sub{font-size:13px;color:var(--green);font-weight:600;letter-spacing:0.5px;}

/* ── SYNC ── */
.sync-indicator{position:fixed;bottom:16px;right:16px;background:var(--dark-blue);color:white;border-radius:var(--radius-full);padding:8px 16px;font-size:12px;font-weight:700;z-index:500;display:none;align-items:center;gap:8px;box-shadow:var(--shadow-3);}
.sync-indicator.show{display:flex;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

@media print{
  .no-print{display:none!important;}
  .modal-bg{position:static;background:none;backdrop-filter:none;padding:0;}
  .modal{box-shadow:none;border:none;max-height:none;}
}
@media(max-width:480px){
  .form-row{grid-template-columns:1fr;}
  .item-btns .btn.sm span{display:none;}
  .header{padding:0 14px;}
  .app{padding:16px 12px 60px;}
}
</style>
</head>

<div class="app">
  <div id="screen-staff">
    <div class="staff-screen">
      <h2>Who's Working Today?</h2>
      <p>Select your name to get started</p>
      <div class="staff-grid" id="staff-grid"></div>
      <div style="max-width:420px;margin:0 auto;">
        <div style="display:flex;gap:8px;">
          <input type="text" id="quick-staff-input" placeholder="Add new name...">
          <button class="btn primary" onclick="quickAddStaff()"><i class="ti ti-plus"></i> Add</button>
        </div>
      </div>
    </div>
  </div>

  <div id="screen-main" class="hidden">
    <div class="tabs no-print">
      <button class="tab-btn active" onclick="switchView('tradesman')" id="tab-tradesman"><i class="ti ti-qrcode"></i> Tradesman</button>
      <button class="tab-btn" onclick="switchView('admin')" id="tab-admin"><i class="ti ti-settings"></i> Admin</button>
    </div>

    <div class="view active" id="view-tradesman">
      <div id="job-banner-wrap"></div>
      <div id="job-set-wrap" class="card">
        <div class="card-title"><i class="ti ti-briefcase"></i> Set Job Number</div>
        <div style="display:flex;gap:8px;">
          <input type="text" id="job-input" placeholder="Enter job number..." style="flex:1;">
          <button class="btn primary" onclick="setJob()"><i class="ti ti-check"></i> Set</button>
        </div>
      </div>
      <div class="search-wrap"><i class="ti ti-search"></i><input type="text" id="tradesman-search" placeholder="Search materials..." oninput="renderTradesmanList()"></div>
      <div id="tradesman-list" class="mat-list"></div>
    </div>

    <div class="view" id="view-admin">
      <div class="stats" id="admin-stats"></div>
      <div class="card">
        <div class="card-title"><i class="ti ti-plus"></i> Add New Material</div>
        <div class="form-row">
          <div><label>Material name *</label><input type="text" id="new-name" placeholder="e.g. Compression Trim"></div>
          <div><label>SKU / Code</label><input type="text" id="new-sku" placeholder="e.g. CP-4L/m-Each"></div>
        </div>
        <div class="form-row">
          <div><label>Low stock threshold</label><input type="number" id="new-threshold" value="5" min="0"></div>
        </div>
        <div style="margin-bottom:10px;">
          <label>Material photo (optional)</label>
          <div class="photo-upload" onclick="document.getElementById('new-photo-input').click()">
            <i class="ti ti-camera"></i><p>Tap to take photo or upload image</p>
            <img id="new-photo-preview" class="photo-preview">
          </div>
          <input type="file" id="new-photo-input" accept="image/*" capture="environment" style="display:none;" onchange="previewPhoto(this,'new-photo-preview')">
        </div>
        <div style="margin-bottom:10px;">
          <label>Colours &amp; starting quantities</label>
          <div id="color-entries"></div>
          <button class="btn sm" id="add-color-new-btn" style="margin-top:8px;"><i class="ti ti-plus"></i> Add colour</button>
        </div>
        <div style="margin-top:16px;"><button class="btn primary" onclick="addMaterial()"><i class="ti ti-device-floppy"></i> Save material</button></div>
      </div>
      <div class="card">
        <div class="card-title"><i class="ti ti-list"></i> Stock Inventory</div>
        <div class="search-wrap" style="margin-bottom:14px;"><i class="ti ti-search"></i><input type="text" id="admin-search" placeholder="Search materials..." oninput="renderAdminList()"></div>
        <div id="admin-list" class="mat-list"></div>
      </div>
      <div class="card">
        <div class="card-title"><i class="ti ti-history"></i> Recent Transactions</div>
        <div id="tx-list"></div>
        <hr class="divider">
        <button class="btn sm" onclick="exportCSV()"><i class="ti ti-download"></i> Export CSV</button>
      </div>
      <div class="card">
        <div class="card-title"><i class="ti ti-users"></i> Staff</div>
        <div style="display:flex;gap:8px;margin-bottom:12px;">
          <input type="text" id="new-staff" placeholder="Add staff member..." style="flex:1;">
          <button class="btn primary" onclick="addStaff()"><i class="ti ti-plus"></i> Add</button>
        </div>
        <div class="staff-tag-list" id="staff-tag-list"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg hidden" id="modal-detail">
  <div class="modal"><div id="modal-detail-content"></div>
  <div class="modal-actions no-print"><button class="btn" onclick="closeModal('modal-detail')"><i class="ti ti-x"></i> Close</button></div></div>
</div>
<div class="modal-bg hidden" id="modal-edit">
  <div class="modal">
    <h2 id="edit-title"><i class="ti ti-edit"></i> Edit Material</h2>
    <div id="modal-edit-content"></div>
    <div class="modal-actions">
      <button class="btn primary" onclick="saveEdit()"><i class="ti ti-device-floppy"></i> Save</button>
      <button class="btn" onclick="closeModal('modal-edit')">Cancel</button>
    </div>
  </div>
</div>

async function sbFetch(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({}, HEADERS, opts.headers || {});
  const res = await fetch(SUPABASE_URL + path, opts);
  if (!res.ok) {
    const err = await res.text();
    throw new Error('Supabase error: ' + err);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function uploadPhoto(file, matId) {
  // Compress first
  const compressed = await compressImageFile(file, 600, 0.8);
  const blob = await fetch(compressed).then(r => r.blob());
  const ext = 'jpg';
  const path = matId + '.' + ext;
  // Delete old first (ignore errors)
  try { await fetch(SUPABASE_URL + '/storage/v1/object/Photos/' + path, { method: 'DELETE', headers: HEADERS }); } catch(e) {}
  const res = await fetch(SUPABASE_URL + '/storage/v1/object/Photos/' + path, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'image/jpeg', 'x-upsert': 'true' },
    body: blob
  });
  if (!res.ok) throw new Error('Photo upload failed: ' + await res.text());
  return SUPABASE_URL + '/storage/v1/object/public/Photos/' + path + '?t=' + Date.now();
}

function compressImageFile(file, maxSize, quality) {
  return new Promise(function(resolve) {
    var reader = new FileReader();
    reader.onload = function(e) {
      compressImage(e.target.result, maxSize, quality, resolve);
    };
    reader.readAsDataURL(file instanceof File ? file : new File([file], 'photo.jpg'));
  });
}

function compressImage(dataUrl, maxSize, quality, callback) {
  var img = new Image();
  img.onload = function() {
    var canvas = document.createElement('canvas');
    var scale = Math.min(maxSize / img.width, maxSize / img.height, 1);
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    callback(canvas.toDataURL('image/jpeg', quality));
  };
  img.src = dataUrl;
}

function previewPhoto(input, previewId) {
  var file = input.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    compressImage(e.target.result, 600, 0.8, function(compressed) {
      var img = document.getElementById(previewId);
      img.src = compressed; img.style.display = 'block';
      input._file = file;
    });
  };
  reader.readAsDataURL(file);
}

function genId() { return 'M' + Date.now().toString(36) + Math.random().toString(36).slice(2,5).toUpperCase(); }
function totalQty(m) { return m.colors.reduce(function(s,c){ return s+c.qty; }, 0); }
function stockClass(m) { var t=totalQty(m); return t===0?'pill-zero':t<=m.threshold?'pill-low':'pill-ok'; }
function stockLabel(m) { var t=totalQty(m); return t===0?'Out of stock':t<=m.threshold?'Low — '+t+' left':t+' in stock'; }
function fmtDate(ts) { var d=new Date(ts); return d.toLocaleDateString('en-AU',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'}); }

async function addMaterial() {

  var sku = document.getElementById('new-sku').value.trim();
  var threshold = parseInt(document.getElementById('new-threshold').value) || 5;
  if (!name) { alert('Please enter a material name.'); return; }
  var colors = getColorRows('color-entries');
  if (!colors.length) colors = [{ hex:'#888888', name:'Standard', qty:0 }];
  var id = genId();
  var maxOrder = materials.reduce(function(mx,x){ return Math.max(mx, x.sortOrder||0); }, 0);
  var m = { id: id, name: name, sku: sku, threshold: threshold, colors: colors, photo: null, createdAt: Date.now(), sortOrder: maxOrder + 1000 };
  // Upload photo if selected
  var photoInput = document.getElementById('new-photo-input');
  if (photoInput._file) {
    try { m.photo = await uploadPhoto(photoInput._file, id); } catch(e) { console.error('Photo upload failed:', e); }
  }
  materials.push(m);
  try {
    await saveMaterial(m);
  } catch(e) { alert('Error saving material: ' + e.message); return; }
  // Reset form
  document.getElementById('new-name').value = '';
  document.getElementById('new-sku').value = '';
  document.getElementById('new-threshold').value = '5';
  document.getElementById('color-entries').innerHTML = '';
  photoInput.value = ''; photoInput._file = null;
  document.getElementById('new-photo-preview').style.display = 'none';
  render();
}

async function duplicateMaterial(id) {
  var src = materials.find(function(x){ return x.id===id; }); if (!src) return;
  var newId = genId();
  var idx = materials.findIndex(function(x){ return x.id===id; });
  var nextOrder = idx + 1 < materials.length ? (materials[idx+1].sortOrder || 0) : (src.sortOrder || 0) + 2000;
  var cloneOrder = Math.round(((src.sortOrder || 0) + nextOrder) / 2);
  var clone = { id: newId, name: src.name+' (copy)', sku: src.sku ? src.sku+'-B' : '', threshold: src.threshold, colors: src.colors.map(function(c){ return {hex:c.hex,name:c.name,qty:0}; }), photo: src.photo || null, createdAt: Date.now(), sortOrder: cloneOrder };
  materials.splice(idx+1, 0, clone);
  try { await saveMaterial(clone); } catch(e) { alert('Error: ' + e.message); return; }
  render();
  setTimeout(function(){ showEdit(clone.id, true); }, 100);
}

async function deleteMaterial(id) {
  if (!confirm('Delete this material?')) return;
  materials = materials.filter(function(m){ return m.id!==id; });
  render();
  try { await deleteMaterialDB(id); } catch(e) { console.error(e); }
}

var dragSrcId = null;
var autoScrollInterval = null;

function startAutoScroll(e) {
  stopAutoScroll();
  var zone = 80; // px from edge to trigger scroll
  var speed = 12;
  autoScrollInterval = setInterval(function() {
    var y = e.clientY;
    if (y < zone) {
      window.scrollBy(0, -speed);
    } else if (y > window.innerHeight - zone) {
      window.scrollBy(0, speed);
    }
  }, 16);
}

function stopAutoScroll() {
  if (autoScrollInterval) { clearInterval(autoScrollInterval); autoScrollInterval = null; }
}

function renderAdminList() {
  var el = document.getElementById('admin-list');
  var list = getFilteredMaterials('admin-search');
  if (!list.length) { el.innerHTML = '<div class="no-items">No materials found.</div>'; return; }
  var searching = (document.getElementById('admin-search').value || '').trim().length > 0;
  var h = '';
  list.forEach(function(m) {
    h += '<div class="mat-item" draggable="' + (!searching) + '" data-id="'+m.id+'" style="' + (!searching ? 'cursor:grab;' : '') + '">' +
      (!searching ? '<div style="color:var(--text-3);font-size:20px;padding:0 4px 0 0;cursor:grab;flex-shrink:0;"><i class="ti ti-grip-vertical"></i></div>' : '') +
      thumbHtml(m) +
      '<div style="flex:1;min-width:0;"><div class="mat-name">'+m.name+'</div><div class="mat-meta">'+(m.sku?'SKU: '+m.sku+' &middot; ':'')+m.colors.length+' colour'+(m.colors.length!==1?'s':'')+'</div><div class="color-dots">'+m.colors.map(function(c){ return '<span class="cdot" style="background:'+c.hex+'" data-tip="'+c.name+': '+c.qty+'"></span>'; }).join('')+'</div></div>' +
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;"><span class="stock-pill '+stockClass(m)+'">'+stockLabel(m)+'</span><div class="item-btns"><button class="btn sm clone" data-action="dup" data-id="'+m.id+'" title="Duplicate"><i class="ti ti-copy"></i> <span>Dup</span></button><button class="btn sm" data-action="qr" data-id="'+m.id+'" title="QR"><i class="ti ti-qrcode"></i></button><button class="btn sm" data-action="edit" data-id="'+m.id+'" title="Edit"><i class="ti ti-edit"></i></button><button class="btn sm danger" data-action="del" data-id="'+m.id+'" title="Delete"><i class="ti ti-trash"></i></button></div></div>' +
      '</div>';
  });
  el.innerHTML = h;

  // Button events
  el.querySelectorAll('[data-action]').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var id=btn.getAttribute('data-id'), action=btn.getAttribute('data-action');
      if(action==='dup') duplicateMaterial(id);
      else if(action==='qr') showQR(id);
      else if(action==='edit') showEdit(id, false);
      else if(action==='del') deleteMaterial(id);
    });
  });

  // Drag-and-drop
  if (!searching) {
    el.querySelectorAll('.mat-item[draggable]').forEach(function(item) {
      item.addEventListener('dragstart', function(e) {
        dragSrcId = item.getAttribute('data-id');
        item.style.opacity = '0.4';
        e.dataTransfer.effectAllowed = 'move';
        document.addEventListener('dragover', startAutoScroll);
      });
      item.addEventListener('dragend', function() {
        item.style.opacity = '1';
        el.querySelectorAll('.mat-item').forEach(function(i){ i.classList.remove('drag-over'); });
        stopAutoScroll();
        document.removeEventListener('dragover', startAutoScroll);
      });
      item.addEventListener('dragover', function(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        el.querySelectorAll('.mat-item').forEach(function(i){ i.classList.remove('drag-over'); });
        item.classList.add('drag-over');
      });
      item.addEventListener('drop', function(e) {
        e.preventDefault();
        var targetId = item.getAttribute('data-id');
        if (!dragSrcId || dragSrcId === targetId) return;
        // Reorder in memory
        var srcIdx = materials.findIndex(function(m){ return m.id === dragSrcId; });
        var tgtIdx = materials.findIndex(function(m){ return m.id === targetId; });
        var moved = materials.splice(srcIdx, 1)[0];
        var newTgt = materials.findIndex(function(m){ return m.id === targetId; });
        materials.splice(newTgt, 0, moved);
        // Reassign sort orders
        materials.forEach(function(m, i){ m.sortOrder = (i + 1) * 1000; });
        renderAdminList();
        renderTradesmanList();
        // Save new order to Supabase
        saveSortOrder();
      });
    });
  }
}

async function saveSortOrder() {
  showSync();
  try {
    await Promise.all(materials.map(function(m) {
      return sbFetch('/rest/v1/materials?id=eq.' + m.id, {
        method: 'PATCH',
        body: JSON.stringify({ sort_order: m.sortOrder })
      });
    }));
  } catch(e) { console.error('Sort order save failed:', e); }
  hideSync();
}

function renderTradesmanList() {
  var el = document.getElementById('tradesman-list');
  var list = getFilteredMaterials('tradesman-search');
  if (!list.length) { el.innerHTML = '<div class="no-items">No materials found.</div>'; return; }
  var h = '';
  list.forEach(function(m) {
    h += '<div class="mat-item" style="cursor:pointer;" data-action="detail" data-id="'+m.id+'">' + thumbHtml(m) + '<div style="flex:1;min-width:0;"><div class="mat-name">'+m.name+'</div><div class="mat-meta">'+(m.sku?'SKU: '+m.sku+' &middot; ':'')+'Tap to collect / return</div><div class="color-dots">'+m.colors.map(function(c){ return '<span class="cdot" style="background:'+c.hex+'" data-tip="'+c.name+': '+c.qty+'"></span>'; }).join('')+'</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;"><span class="stock-pill '+stockClass(m)+'">'+stockLabel(m)+'</span><i class="ti ti-chevron-right" style="color:var(--muted);font-size:18px;"></i></div></div>';
  });
  el.innerHTML = h;
  el.querySelectorAll('[data-action="detail"]').forEach(function(item) {
    item.addEventListener('click', function(){ showDetail(item.getAttribute('data-id')); });
  });
}

function renderTransactions() {
  var el = document.getElementById('tx-list');
  var recent = transactions.slice(0, 25);
  if (!recent.length) { el.innerHTML = '<div style="font-size:13px;color:var(--muted);padding:8px 0;">No transactions yet.</div>'; return; }
  el.innerHTML = recent.map(function(tx) {
    var cls=tx.type==='collect'?'out':'in', icon=tx.type==='collect'?'ti-arrow-up-right':'ti-arrow-down-left', sign=tx.type==='collect'?'-':'+';
    return '<div class="tx-row"><i class="ti '+icon+' tx-icon '+cls+'"></i><div class="tx-info"><span class="tx-mat">'+tx.matName+'</span> <span class="tx-col">— '+tx.colorName+'</span><br>'+(tx.job?'<span class="tx-tag">'+tx.job+'</span>':'')+(tx.staff?'<span class="tx-tag staff"><i class="ti ti-user" style="font-size:10px"></i> '+tx.staff+'</span>':'')+'</div><span class="tx-qty '+cls+'">'+sign+tx.qty+'</span><span class="tx-time">'+fmtDate(tx.ts)+'</span></div>';
  }).join('');
}

// ── DETAIL MODAL ──
function showDetail(id) {
  var m = materials.find(function(x){ return x.id===id; }); if (!m) return;
  var jobWarn = !activeJob ? '<div class="warn-box"><i class="ti ti-alert-triangle"></i> No active job set — enter a job number first.</div>' : '';
  var jobBadge = activeJob ? '<div style="margin-bottom:10px;"><span class="tx-tag" style="font-size:13px;padding:5px 12px;">'+activeJob+'</span> <span class="tx-tag staff" style="font-size:13px;padding:5px 12px;"><i class="ti ti-user" style="font-size:12px;margin-right:3px;"></i>'+activeStaff+'</span></div>' : '';
  var photoHtml = m.photo ? '<img src="'+m.photo+'" class="detail-photo" alt="'+m.name+'">' : '';
  var rows = '';
  m.colors.forEach(function(c,i) {
    rows += '<div class="cstock-row"><div class="cswatch"><span class="cswatch-dot" style="background:'+c.hex+'"></span><div><div class="cname">'+c.name+'</div><div class="cqty-label" id="ql-'+id+'-'+i+'">'+c.qty+' in stock</div></div></div><div class="cactions"><div class="cbtns"><button class="btn sm danger" data-mat="'+id+'" data-ci="'+i+'" data-type="collect"><i class="ti ti-arrow-up-right"></i> Collect</button><button class="btn sm success" data-mat="'+id+'" data-ci="'+i+'" data-type="return"><i class="ti ti-arrow-down-left"></i> Return</button></div><div class="qty-row"><label>Qty:</label><input type="number" id="qi-'+id+'-'+i+'" value="1" min="1"></div></div></div>';
  });
  var el = document.getElementById('modal-detail-content');
  el.innerHTML = '<div class="detail-name">'+m.name+'</div>'+(m.sku?'<div class="detail-sku">SKU: '+m.sku+'</div>':'<div style="margin-bottom:10px;"></div>')+photoHtml+jobWarn+jobBadge+rows+'<p style="margin-top:12px;font-size:12px;color:var(--muted);">Set quantity then tap Collect or Return.</p>';
  el.querySelectorAll('[data-mat]').forEach(function(btn) {
    btn.addEventListener('click', function(){ adjustStock(btn.getAttribute('data-mat'), parseInt(btn.getAttribute('data-ci')), btn.getAttribute('data-type')); });
  });
  document.getElementById('modal-detail').classList.remove('hidden');
}

async function adjustStock(matId, colorIdx, type) {
  if (!activeJob) { alert('Please set a job number first.'); return; }
  var m = materials.find(function(x){ return x.id===matId; }); if (!m) return;
  var c = m.colors[colorIdx];
  var qty = parseInt(document.getElementById('qi-'+matId+'-'+colorIdx).value) || 1;
  if (type==='collect') { if(c.qty<=0){ alert('None in stock.'); return; } if(qty>c.qty){ alert('Only '+c.qty+' in stock.'); return; } c.qty=Math.max(0,c.qty-qty); }
  else { c.qty += qty; }
  var tx = { id: genId(), ts: Date.now(), matId: matId, matName: m.name, colorName: c.name, type: type, qty: qty, job: activeJob, staff: activeStaff };
  transactions.unshift(tx);
  document.getElementById('ql-'+matId+'-'+colorIdx).textContent = c.qty + ' in stock';
  renderAdminStats(); renderAdminList(); renderTradesmanList(); renderTransactions();
  try {
    await Promise.all([ saveMaterial(m), saveTransaction(tx) ]);
  } catch(e) { console.error('Save error:', e); }
}

// ── QR ──
function showQR(id) {
  var m = materials.find(function(x){ return x.id===id; }); if (!m) return;
  currentQRId = id;
  document.getElementById('qr-modal-title').innerHTML = '<i class="ti ti-qrcode" style="color:var(--blue)"></i> QR Code';
  document.getElementById('qr-mat-name').textContent = m.name;
  document.getElementById('qr-label').textContent = m.sku || m.id;
  var printPhoto = document.getElementById('qr-print-photo');
  if (m.photo) { printPhoto.src = m.photo; printPhoto.classList.remove('hidden'); }
  else { printPhoto.classList.add('hidden'); }
  var container = document.getElementById('qrcode-container'); container.innerHTML = '';
  new QRCode(container, { text: 'JSJSTOCK:'+m.id, width: 200, height: 200, colorDark: '#0d52a5', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
  document.getElementById('modal-qr').classList.remove('hidden');
}

function printQR() { window.print(); }

function downloadQR() {
  var canvas = document.querySelector('#qrcode-container canvas'); if (!canvas) return;
  var m = materials.find(function(x){ return x.id===currentQRId; });
  var a = document.createElement('a');
  a.download = 'qr-'+(m?m.name.replace(/[^a-z0-9]/gi,'-').toLowerCase():currentQRId)+'.png';
  a.href = canvas.toDataURL(); a.click();
}

// ── EDIT ──
function showEdit(id, isClone) {
  var m = materials.find(function(x){ return x.id===id; }); if (!m) return;
  editingId = id;
  document.getElementById('edit-title').innerHTML = isClone ? '<i class="ti ti-copy" style="color:var(--blue)"></i> Edit Duplicated Material' : '<i class="ti ti-edit" style="color:var(--blue)"></i> Edit Material';
  var colorRows = m.colors.map(function(c) {
    return '<div class="color-row"><input type="color" value="'+c.hex+'" style="width:34px;height:34px;padding:2px;border-radius:50%;cursor:pointer;border:2px solid var(--border);flex-shrink:0;background:transparent;"><input type="text" value="'+c.name+'" placeholder="Colour name" style="flex:1;"><input type="number" min="0" value="'+c.qty+'" style="width:70px;"><button class="rm-btn" onclick="this.parentElement.remove()">&#215;</button></div>';
  }).join('');
  var photoPreviewHtml = m.photo ? '<img src="'+m.photo+'" style="width:100%;max-height:120px;object-fit:cover;border-radius:8px;margin-bottom:8px;display:block;">' : '';
  document.getElementById('modal-edit-content').innerHTML =
    (isClone?'<div class="info-box"><i class="ti ti-info-circle"></i> Colours copied — quantities reset. Update name and SKU.</div>':'')+
    '<div style="margin-bottom:12px;"><label>Material name</label><input type="text" id="edit-name" value="'+m.name+'"></div>'+
    '<div style="margin-bottom:12px;"><label>SKU / Code</label><input type="text" id="edit-sku" value="'+(m.sku||'')+'"></div>'+
    '<div style="margin-bottom:12px;"><label>Low stock threshold</label><input type="number" id="edit-threshold" value="'+m.threshold+'" min="0"></div>'+
    '<div style="margin-bottom:12px;"><label>Material photo</label>'+photoPreviewHtml+
    '<div class="photo-upload" onclick="document.getElementById(\'edit-photo-input\').click()"><i class="ti ti-camera"></i><p>'+(m.photo?'Tap to replace photo':'Tap to add photo')+'</p><img id="edit-photo-preview" class="photo-preview"></div>'+
    '<input type="file" id="edit-photo-input" accept="image/*" capture="environment" style="display:none;" onchange="previewPhoto(this,\'edit-photo-preview\')"></div>'+
    '<label style="margin-bottom:8px;display:block;">Colours &amp; quantities</label>'+
    '<div id="edit-colors">'+colorRows+'</div>'+
    '<button class="btn sm" id="add-edit-color-btn" style="margin-top:8px;"><i class="ti ti-plus"></i> Add colour</button>';
  document.getElementById('add-edit-color-btn').addEventListener('click', function(){ addColorRow('edit-colors'); });
  document.getElementById('modal-edit').classList.remove('hidden');
  if (isClone) setTimeout(function(){ var n=document.getElementById('edit-name'); if(n) n.select(); }, 100);
}

async function saveEdit() {
  var m = materials.find(function(x){ return x.id===editingId; }); if (!m) return;
  m.name = document.getElementById('edit-name').value.trim() || m.name;
  m.sku = document.getElementById('edit-sku').value.trim();
  m.threshold = parseInt(document.getElementById('edit-threshold').value) || 5;
  var colors = getColorRows('edit-colors');
  if (!colors.length) { alert('Add at least one colour.'); return; }
  m.colors = colors;
  // Upload new photo if selected
  var photoInput = document.getElementById('edit-photo-input');
  if (photoInput && photoInput._file) {
    try { m.photo = await uploadPhoto(photoInput._file, m.id); } catch(e) { console.error('Photo upload failed:', e); }
  }
  closeModal('modal-edit');
  render();
  try { await saveMaterial(m); } catch(e) { alert('Error saving: ' + e.message); }
}

// ── CSV ──
function exportCSV() {
  if (!transactions.length) { alert('No transactions yet.'); return; }
  var rows = [['Date','Time','Staff','Job Number','Material','SKU','Colour','Type','Quantity']];
  var mMap = {};
  materials.forEach(function(m){ mMap[m.id] = m.sku||''; });
  transactions.forEach(function(tx) {
    var d = new Date(tx.ts);
    rows.push([d.toLocaleDateString('en-AU'), d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'}), tx.staff||'', tx.job||'', tx.matName, mMap[tx.matId]||'', tx.colorName, tx.type==='collect'?'Collect':'Return', tx.qty]);
  });
  var csv = rows.map(function(r){ return r.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'jsj-stock-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

// ── INIT ──
document.getElementById('add-color-new-btn').addEventListener('click', function(){ addColorRow('color-entries'); });

async function init() {
  var overlay = document.getElementById('loading-overlay');
  overlay.style.display = 'flex';
  try {
    await loadAll();
    if (materials.length === 0) {
      for (var i = 0; i < SEED_MATERIALS.length; i++) {
        await saveMaterial(SEED_MATERIALS[i]);
      }
      await loadAll();
    }
    overlay.style.display = 'none';
    renderStaffScreen();
  } catch(e) {
    console.error('Load error:', e);
    overlay.innerHTML = '<div style="text-align:center;padding:20px;max-width:400px;">' +
      '<div style="font-size:48px;margin-bottom:16px;">⚠️</div>' +
      '<div style="font-family:Barlow Condensed,sans-serif;font-size:22px;font-weight:700;color:#dc2626;margin-bottom:12px;">Connection Failed</div>' +
      '<div style="font-size:14px;color:#4a5568;margin-bottom:16px;">Could not connect to the database.</div>' +
      '<div style="background:#fee2e2;border-radius:8px;padding:12px;font-size:12px;color:#b91c1c;text-align:left;margin-bottom:16px;word-break:break-all;">' + e.message + '</div>' +
      '<div style="font-size:13px;color:#4a5568;margin-bottom:16px;">Make sure RLS policies are set in Supabase:<br><br>' +
      '<code style="background:#f3f4f6;padding:4px 8px;border-radius:4px;font-size:11px;">create policy "Allow all" on materials for all using (true) with check (true);</code></div>' +
      '<button onclick="location.reload()" style="background:#0d52a5;color:white;border:none;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">Try Again</button>' +
      '</div>';
  }
}

init();
</script>
