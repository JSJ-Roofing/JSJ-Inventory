<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>JSJ Roofing — Stock Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
:root{
  --blue:#0d52a5;--blue-dark:#0a3f80;--blue-light:#e8f0fb;--blue-mid:#1a6bc7;
  --accent:#e8690a;--light:#f5f7fa;--white:#ffffff;--text:#1a1a2e;--text2:#4a5568;
  --muted:#8a9bb0;--success:#16a34a;--danger:#dc2626;--warn:#d97706;
  --border:#dde3ed;--radius:12px;--surface:#f5f7fa;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow',sans-serif;background:var(--light);color:var(--text);min-height:100vh;}
.app{max-width:700px;margin:0 auto;padding:0 16px 40px;}
.header{display:flex;align-items:center;gap:14px;padding:16px 0 20px;border-bottom:2px solid var(--blue);margin-bottom:20px;}
.logo-img{height:52px;width:auto;}
.logo-text .brand{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;color:var(--blue);letter-spacing:1px;line-height:1;}
.logo-text .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.staff-screen{text-align:center;padding:40px 20px;}
.staff-screen h2{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:var(--blue);margin-bottom:8px;text-transform:uppercase;}
.staff-screen p{color:var(--text2);font-size:14px;margin-bottom:24px;}
.staff-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:400px;margin:0 auto 24px;}
.staff-btn{padding:16px 12px;border-radius:10px;border:2px solid var(--border);background:var(--white);cursor:pointer;font-size:15px;font-weight:600;color:var(--text);font-family:'Barlow',sans-serif;transition:all 0.2s;display:flex;align-items:center;gap:8px;}
.staff-btn:hover{border-color:var(--blue);background:var(--blue-light);color:var(--blue);}
.staff-btn i{font-size:20px;color:var(--muted);}
.staff-btn:hover i{color:var(--blue);}
.staff-banner{background:var(--blue);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.staff-banner .name{color:white;font-weight:600;font-size:15px;}
.staff-banner .role{color:rgba(255,255,255,0.7);font-size:12px;}
.staff-banner .logout-btn{margin-left:auto;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:white;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;font-family:'Barlow',sans-serif;font-weight:600;}
.tabs{display:flex;gap:8px;margin-bottom:20px;}
.tab-btn{flex:1;padding:11px 8px;border-radius:10px;border:2px solid var(--border);background:var(--white);color:var(--text2);cursor:pointer;font-family:'Barlow',sans-serif;font-size:14px;font-weight:600;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:7px;}
.tab-btn.active{background:var(--blue);color:white;border-color:var(--blue);box-shadow:0 4px 12px rgba(13,82,165,0.25);}
.tab-btn:hover:not(.active){background:var(--blue-light);border-color:var(--blue);color:var(--blue);}
.view{display:none;}.view.active{display:block;}
.search-wrap{position:relative;margin-bottom:14px;}
.search-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px;}
.search-wrap input{padding-left:38px;background:var(--white);border:1.5px solid var(--border);border-radius:10px;font-size:14px;}
.search-wrap input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(13,82,165,0.1);}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,0.05);}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:0.5px;color:var(--blue);margin-bottom:14px;display:flex;align-items:center;gap:8px;text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:10px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.form-row.full{grid-template-columns:1fr;}
label{font-size:12px;color:var(--text2);display:block;margin-bottom:5px;font-weight:600;letter-spacing:0.3px;text-transform:uppercase;}
input,select{width:100%;padding:9px 12px;background:var(--white);border:1.5px solid var(--border);border-radius:8px;font-size:14px;color:var(--text);font-family:'Barlow',sans-serif;transition:border-color 0.2s;}
input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(13,82,165,0.1);}
input::placeholder{color:#bbb;}
.btn{padding:9px 16px;border-radius:8px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;font-size:14px;font-weight:600;color:var(--text2);font-family:'Barlow',sans-serif;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{background:var(--light);}
.btn.primary{background:var(--blue);color:white;border-color:var(--blue);}
.btn.primary:hover{background:var(--blue-dark);}
.btn.success{background:var(--success);color:white;border-color:var(--success);}
.btn.danger{background:var(--danger);color:white;border-color:var(--danger);}
.btn.clone{background:#eff6ff;color:var(--blue);border-color:#bfdbfe;}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.mat-list{display:flex;flex-direction:column;gap:8px;}
.mat-item{background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;transition:border-color 0.2s,box-shadow 0.2s;}
.mat-item:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(13,82,165,0.1);}
.mat-thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;border:1px solid var(--border);flex-shrink:0;background:var(--light);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px;overflow:hidden;}
.mat-thumb img{width:100%;height:100%;object-fit:cover;}
.mat-name{font-size:15px;font-weight:600;color:var(--text);}
.mat-meta{font-size:12px;color:var(--muted);margin-top:2px;}
.color-dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.cdot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(0,0,0,0.1);position:relative;cursor:pointer;flex-shrink:0;}
.cdot:hover::after{content:attr(data-tip);position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:white;font-size:11px;padding:3px 7px;border-radius:5px;white-space:nowrap;z-index:10;font-family:'Barlow',sans-serif;}
.stock-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;flex-shrink:0;letter-spacing:0.3px;text-transform:uppercase;}
.pill-ok{background:#dcfce7;color:#15803d;}
.pill-low{background:#fef3c7;color:#b45309;}
.pill-zero{background:#fee2e2;color:#b91c1c;}
.item-btns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;}
.job-banner{background:var(--blue);border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}
.job-icon{color:white;font-size:22px;flex-shrink:0;opacity:0.9;}
.job-banner strong{color:white;font-size:16px;}
.job-banner small{color:rgba(255,255,255,0.7);font-size:12px;display:block;}
.job-banner .change-btn{margin-left:auto;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);color:white;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12px;font-family:'Barlow',sans-serif;font-weight:600;white-space:nowrap;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.stat{background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,0.05);}
.stat-n{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:var(--blue);}
.stat-l{font-size:12px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.3px;}
.color-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.color-row input[type=color]{width:34px;height:34px;padding:2px;border-radius:50%;cursor:pointer;border:2px solid var(--border);flex-shrink:0;background:transparent;}
.color-row input[type=text]{flex:1;}
.color-row input[type=number]{width:70px;}
.rm-btn{background:none;border:none;color:var(--danger);font-size:20px;cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0;}
.photo-upload{border:2px dashed var(--border);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:all 0.2s;margin-bottom:10px;}
.photo-upload:hover{border-color:var(--blue);background:var(--blue-light);}
.photo-upload i{font-size:28px;color:var(--muted);display:block;margin-bottom:6px;}
.photo-upload p{font-size:13px;color:var(--muted);}
.photo-preview{width:100%;max-height:160px;object-fit:cover;border-radius:8px;margin-top:8px;display:none;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);}
.modal{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:20px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.15);}
.modal h2{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--blue);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.modal-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
.detail-name{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;color:var(--text);letter-spacing:0.5px;}
.detail-sku{font-size:12px;color:var(--muted);margin:4px 0 14px;font-family:monospace;}
.detail-photo{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-bottom:14px;}
.cstock-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
.cstock-row:last-of-type{border-bottom:none;}
.cswatch{display:flex;align-items:center;gap:10px;}
.cswatch-dot{width:24px;height:24px;border-radius:50%;border:2px solid rgba(0,0,0,0.1);flex-shrink:0;}
.cname{font-size:14px;font-weight:600;color:var(--text);}
.cqty-label{font-size:12px;color:var(--muted);margin-top:1px;}
.cactions{display:flex;flex-direction:column;align-items:flex-end;gap:7px;}
.cbtns{display:flex;gap:6px;}
.qty-row{display:flex;align-items:center;gap:6px;}
.qty-row label{font-size:11px;margin:0;text-transform:none;}
.qty-row input{width:58px;padding:5px 8px;font-size:13px;}
.qr-print-wrap{text-align:center;}
.qr-print-wrap .print-photo{width:160px;height:120px;object-fit:cover;border-radius:8px;margin:10px auto;display:block;border:1px solid var(--border);}
#qrcode-container canvas{display:block;margin:0 auto;border-radius:8px;}
.tx-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
.tx-row:last-child{border-bottom:none;}
.tx-icon{font-size:18px;flex-shrink:0;}
.tx-icon.out{color:var(--danger);}
.tx-icon.in{color:var(--success);}
.tx-info{flex:1;min-width:0;}
.tx-mat{font-weight:600;color:var(--text);}
.tx-col{color:var(--muted);}
.tx-tag{display:inline-block;background:var(--blue-light);color:var(--blue);font-size:10px;padding:1px 7px;border-radius:99px;font-weight:600;margin-top:2px;margin-right:3px;}
.tx-tag.staff{background:#f0fdf4;color:#15803d;}
.tx-qty{font-weight:700;white-space:nowrap;}
.tx-qty.out{color:var(--danger);}
.tx-qty.in{color:var(--success);}
.tx-time{font-size:11px;color:var(--muted);white-space:nowrap;}
.staff-tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.staff-tag{display:inline-flex;align-items:center;gap:6px;background:var(--blue-light);color:var(--blue);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600;}
.staff-tag button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;padding:0;line-height:1;}
.no-items{text-align:center;padding:28px;color:var(--muted);font-size:14px;}
.hidden{display:none!important;}
.warn-box{background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:10px 13px;font-size:13px;color:#92400e;display:flex;gap:8px;align-items:flex-start;margin-bottom:12px;}
.info-box{background:var(--blue-light);border:1px solid #93c5fd;border-radius:8px;padding:10px 13px;font-size:13px;color:var(--blue-dark);display:flex;gap:8px;margin-bottom:12px;}
.divider{border:none;border-top:1px solid var(--border);margin:12px 0;}
/* Loading overlay */
#loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,0.92);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.spinner{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.sync-indicator{position:fixed;top:12px;right:12px;background:var(--blue);color:white;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;z-index:500;display:none;align-items:center;gap:6px;}
.sync-indicator.show{display:flex;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:white;animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
@media print{
  .no-print{display:none!important;}
  .modal-bg{position:static;background:none;backdrop-filter:none;padding:0;}
  .modal{box-shadow:none;border:none;max-height:none;}
}
@media(max-width:480px){.form-row{grid-template-columns:1fr;}.item-btns .btn.sm span{display:none;}}
</style>
</head>

    <div class="logo-text">
      <div class="brand">JSJ Roofing</div>
      <div class="sub">Stock Manager</div>
    </div>
    <div class="header-right">
      <div id="header-staff"></div>
    </div>
  </div>

  <!-- STAFF LOGIN SCREEN -->
  <div id="screen-staff">
    <div class="staff-screen">
      <h2>Who's Working Today?</h2>
      <p>Select your name to continue</p>
      <div class="staff-grid" id="staff-grid"></div>
      <div style="max-width:400px;margin:0 auto;">
        <div style="display:flex;gap:8px;">
          <input type="text" id="quick-staff-input" placeholder="Add new name..." style="flex:1;">
          <button class="btn primary" onclick="quickAddStaff()"><i class="ti ti-plus"></i> Add</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="screen-main" class="hidden">
    <div class="tabs no-print">
      <button class="tab-btn active" onclick="switchView('tradesman')" id="tab-tradesman"><i class="ti ti-qrcode"></i> Tradesman</button>
      <button class="tab-btn" onclick="switchView('admin')" id="tab-admin"><i class="ti ti-settings"></i> Admin</button>
    </div>

    <!-- TRADESMAN VIEW -->
    <div class="view active" id="view-tradesman">
      <div id="job-banner-wrap"></div>
      <div id="job-set-wrap" class="card">
        <div class="card-title"><i class="ti ti-briefcase"></i> Set Job Number</div>

function compressImageFile(file, maxSize, quality) {
  return new Promise(function(resolve) {
    var reader = new FileReader();
    reader.onload = function(e) {
      compressImage(e.target.result, maxSize, quality, resolve);
    };
    reader.readAsDataURL(file instanceof File ? file : new File([file], 'photo.jpg'));
  });
}

function compressImage(dataUrl, maxSize, quality, callback) {
  var img = new Image();
  img.onload = function() {
    var canvas = document.createElement('canvas');
    var scale = Math.min(maxSize / img.width, maxSize / img.height, 1);
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    callback(canvas.toDataURL('image/jpeg', quality));
  };
  img.src = dataUrl;
}

function previewPhoto(input, previewId) {
  var file = input.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    compressImage(e.target.result, 600, 0.8, function(compressed) {
      var img = document.getElementById(previewId);
      img.src = compressed; img.style.display = 'block';
      input._file = file;
    });
  };
  reader.readAsDataURL(file);
}

  var idx = materials.findIndex(function(x){ return x.id===id; });
  materials.splice(idx+1, 0, clone);

  var h = '';
  list.forEach(function(m) {
    h += '<div class="mat-item">' + thumbHtml(m) + '<div style="flex:1;min-width:0;"><div class="mat-name">'+m.name+'</div><div class="mat-meta">'+(m.sku?'SKU: '+m.sku+' &middot; ':'')+m.colors.length+' colour'+(m.colors.length!==1?'s':'')+'</div><div class="color-dots">'+m.colors.map(function(c){ return '<span class="cdot" style="background:'+c.hex+'" data-tip="'+c.name+': '+c.qty+'"></span>'; }).join('')+'</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;"><span class="stock-pill '+stockClass(m)+'">'+stockLabel(m)+'</span><div class="item-btns"><button class="btn sm clone" data-action="dup" data-id="'+m.id+'" title="Duplicate"><i class="ti ti-copy"></i> <span>Dup</span></button><button class="btn sm" data-action="qr" data-id="'+m.id+'" title="QR"><i class="ti ti-qrcode"></i></button><button class="btn sm" data-action="edit" data-id="'+m.id+'" title="Edit"><i class="ti ti-edit"></i></button><button class="btn sm danger" data-action="del" data-id="'+m.id+'" title="Delete"><i class="ti ti-trash"></i></button></div></div></div>';
  });
  el.innerHTML = h;
  el.querySelectorAll('[data-action]').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var id=btn.getAttribute('data-id'), action=btn.getAttribute('data-action');
      if(action==='dup') duplicateMaterial(id);
      else if(action==='qr') showQR(id);
      else if(action==='edit') showEdit(id, false);
      else if(action==='del') deleteMaterial(id);
    });
  });
}

function renderTradesmanList() {
  var el = document.getElementById('tradesman-list');
  var list = getFilteredMaterials('tradesman-search');
  if (!list.length) { el.innerHTML = '<div class="no-items">No materials found.</div>'; return; }
  var h = '';
  list.forEach(function(m) {
    h += '<div class="mat-item" style="cursor:pointer;" data-action="detail" data-id="'+m.id+'">' + thumbHtml(m) + '<div style="flex:1;min-width:0;"><div class="mat-name">'+m.name+'</div><div class="mat-meta">'+(m.sku?'SKU: '+m.sku+' &middot; ':'')+'Tap to collect / return</div><div class="color-dots">'+m.colors.map(function(c){ return '<span class="cdot" style="background:'+c.hex+'" data-tip="'+c.name+': '+c.qty+'"></span>'; }).join('')+'</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;"><span class="stock-pill '+stockClass(m)+'">'+stockLabel(m)+'</span><i class="ti ti-chevron-right" style="color:var(--muted);font-size:18px;"></i></div></div>';
  });
  el.innerHTML = h;
  el.querySelectorAll('[data-action="detail"]').forEach(function(item) {
    item.addEventListener('click', function(){ showDetail(item.getAttribute('data-id')); });
  });
}

function renderTransactions() {
  var el = document.getElementById('tx-list');
  var recent = transactions.slice(0, 25);
  if (!recent.length) { el.innerHTML = '<div style="font-size:13px;color:var(--muted);padding:8px 0;">No transactions yet.</div>'; return; }
  el.innerHTML = recent.map(function(tx) {
    var cls=tx.type==='collect'?'out':'in', icon=tx.type==='collect'?'ti-arrow-up-right':'ti-arrow-down-left', sign=tx.type==='collect'?'-':'+';
    return '<div class="tx-row"><i class="ti '+icon+' tx-icon '+cls+'"></i><div class="tx-info"><span class="tx-mat">'+tx.matName+'</span> <span class="tx-col">— '+tx.colorName+'</span><br>'+(tx.job?'<span class="tx-tag">'+tx.job+'</span>':'')+(tx.staff?'<span class="tx-tag staff"><i class="ti ti-user" style="font-size:10px"></i> '+tx.staff+'</span>':'')+'</div><span class="tx-qty '+cls+'">'+sign+tx.qty+'</span><span class="tx-time">'+fmtDate(tx.ts)+'</span></div>';
  }).join('');
}

// ── DETAIL MODAL ──
function showDetail(id) {
  var m = materials.find(function(x){ return x.id===id; }); if (!m) return;
  var jobWarn = !activeJob ? '<div class="warn-box"><i class="ti ti-alert-triangle"></i> No active job set — enter a job number first.</div>' : '';
  var jobBadge = activeJob ? '<div style="margin-bottom:10px;"><span class="tx-tag" style="font-size:13px;padding:5px 12px;">'+activeJob+'</span> <span class="tx-tag staff" style="font-size:13px;padding:5px 12px;"><i class="ti ti-user" style="font-size:12px;margin-right:3px;"></i>'+activeStaff+'</span></div>' : '';
  var photoHtml = m.photo ? '<img src="'+m.photo+'" class="detail-photo" alt="'+m.name+'">' : '';
  var rows = '';
  m.colors.forEach(function(c,i) {
    rows += '<div class="cstock-row"><div class="cswatch"><span class="cswatch-dot" style="background:'+c.hex+'"></span><div><div class="cname">'+c.name+'</div><div class="cqty-label" id="ql-'+id+'-'+i+'">'+c.qty+' in stock</div></div></div><div class="cactions"><div class="cbtns"><button class="btn sm danger" data-mat="'+id+'" data-ci="'+i+'" data-type="collect"><i class="ti ti-arrow-up-right"></i> Collect</button><button class="btn sm success" data-mat="'+id+'" data-ci="'+i+'" data-type="return"><i class="ti ti-arrow-down-left"></i> Return</button></div><div class="qty-row"><label>Qty:</label><input type="number" id="qi-'+id+'-'+i+'" value="1" min="1"></div></div></div>';
  });
  var el = document.getElementById('modal-detail-content');
  el.innerHTML = '<div class="detail-name">'+m.name+'</div>'+(m.sku?'<div class="detail-sku">SKU: '+m.sku+'</div>':'<div style="margin-bottom:10px;"></div>')+photoHtml+jobWarn+jobBadge+rows+'<p style="margin-top:12px;font-size:12px;color:var(--muted);">Set quantity then tap Collect or Return.</p>';
  el.querySelectorAll('[data-mat]').forEach(function(btn) {
    btn.addEventListener('click', function(){ adjustStock(btn.getAttribute('data-mat'), parseInt(btn.getAttribute('data-ci')), btn.getAttribute('data-type')); });
  });
  document.getElementById('modal-detail').classList.remove('hidden');
}

async function adjustStock(matId, colorIdx, type) {
  if (!activeJob) { alert('Please set a job number first.'); return; }
  var m = materials.find(function(x){ return x.id===matId; }); if (!m) return;
  var c = m.colors[colorIdx];
  var qty = parseInt(document.getElementById('qi-'+matId+'-'+colorIdx).value) || 1;
  if (type==='collect') { if(c.qty<=0){ alert('None in stock.'); return; } if(qty>c.qty){ alert('Only '+c.qty+' in stock.'); return; } c.qty=Math.max(0,c.qty-qty); }
  else { c.qty += qty; }
  var tx = { id: genId(), ts: Date.now(), matId: matId, matName: m.name, colorName: c.name, type: type, qty: qty, job: activeJob, staff: activeStaff };
  transactions.unshift(tx);
  document.getElementById('ql-'+matId+'-'+colorIdx).textContent = c.qty + ' in stock';
  renderAdminStats(); renderAdminList(); renderTradesmanList(); renderTransactions();
  try {
    await Promise.all([ saveMaterial(m), saveTransaction(tx) ]);
  } catch(e) { console.error('Save error:', e); }
}

// ── QR ──
function showQR(id) {
  var m = materials.find(function(x){ return x.id===id; }); if (!m) return;
  currentQRId = id;
  document.getElementById('qr-modal-title').innerHTML = '<i class="ti ti-qrcode" style="color:var(--blue)"></i> QR Code';
  document.getElementById('qr-mat-name').textContent = m.name;
  document.getElementById('qr-label').textContent = m.sku || m.id;
  var printPhoto = document.getElementById('qr-print-photo');
  if (m.photo) { printPhoto.src = m.photo; printPhoto.classList.remove('hidden'); }
  else { printPhoto.classList.add('hidden'); }
  var container = document.getElementById('qrcode-container'); container.innerHTML = '';
  new QRCode(container, { text: 'JSJSTOCK:'+m.id, width: 200, height: 200, colorDark: '#0d52a5', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
  document.getElementById('modal-qr').classList.remove('hidden');
}

function printQR() { window.print(); }

function downloadQR() {
  var canvas = document.querySelector('#qrcode-container canvas'); if (!canvas) return;
  var m = materials.find(function(x){ return x.id===currentQRId; });
  var a = document.createElement('a');
  a.download = 'qr-'+(m?m.name.replace(/[^a-z0-9]/gi,'-').toLowerCase():currentQRId)+'.png';
  a.href = canvas.toDataURL(); a.click();
}

// ── EDIT ──
function showEdit(id, isClone) {
  var m = materials.find(function(x){ return x.id===id; }); if (!m) return;
  editingId = id;
  document.getElementById('edit-title').innerHTML = isClone ? '<i class="ti ti-copy" style="color:var(--blue)"></i> Edit Duplicated Material' : '<i class="ti ti-edit" style="color:var(--blue)"></i> Edit Material';
  var colorRows = m.colors.map(function(c) {
    return '<div class="color-row"><input type="color" value="'+c.hex+'" style="width:34px;height:34px;padding:2px;border-radius:50%;cursor:pointer;border:2px solid var(--border);flex-shrink:0;background:transparent;"><input type="text" value="'+c.name+'" placeholder="Colour name" style="flex:1;"><input type="number" min="0" value="'+c.qty+'" style="width:70px;"><button class="rm-btn" onclick="this.parentElement.remove()">&#215;</button></div>';
  }).join('');
  var photoPreviewHtml = m.photo ? '<img src="'+m.photo+'" style="width:100%;max-height:120px;object-fit:cover;border-radius:8px;margin-bottom:8px;display:block;">' : '';
  document.getElementById('modal-edit-content').innerHTML =
    (isClone?'<div class="info-box"><i class="ti ti-info-circle"></i> Colours copied — quantities reset. Update name and SKU.</div>':'')+
    '<div style="margin-bottom:12px;"><label>Material name</label><input type="text" id="edit-name" value="'+m.name+'"></div>'+
    '<div style="margin-bottom:12px;"><label>SKU / Code</label><input type="text" id="edit-sku" value="'+(m.sku||'')+'"></div>'+
    '<div style="margin-bottom:12px;"><label>Low stock threshold</label><input type="number" id="edit-threshold" value="'+m.threshold+'" min="0"></div>'+
    '<div style="margin-bottom:12px;"><label>Material photo</label>'+photoPreviewHtml+
    '<div class="photo-upload" onclick="document.getElementById(\'edit-photo-input\').click()"><i class="ti ti-camera"></i><p>'+(m.photo?'Tap to replace photo':'Tap to add photo')+'</p><img id="edit-photo-preview" class="photo-preview"></div>'+
    '<input type="file" id="edit-photo-input" accept="image/*" capture="environment" style="display:none;" onchange="previewPhoto(this,\'edit-photo-preview\')"></div>'+
    '<label style="margin-bottom:8px;display:block;">Colours &amp; quantities</label>'+
    '<div id="edit-colors">'+colorRows+'</div>'+
    '<button class="btn sm" id="add-edit-color-btn" style="margin-top:8px;"><i class="ti ti-plus"></i> Add colour</button>';
  document.getElementById('add-edit-color-btn').addEventListener('click', function(){ addColorRow('edit-colors'); });
  document.getElementById('modal-edit').classList.remove('hidden');
  if (isClone) setTimeout(function(){ var n=document.getElementById('edit-name'); if(n) n.select(); }, 100);
}

async function saveEdit() {
  var m = materials.find(function(x){ return x.id===editingId; }); if (!m) return;
  m.name = document.getElementById('edit-name').value.trim() || m.name;
  m.sku = document.getElementById('edit-sku').value.trim();
  m.threshold = parseInt(document.getElementById('edit-threshold').value) || 5;
  var colors = getColorRows('edit-colors');
  if (!colors.length) { alert('Add at least one colour.'); return; }
  m.colors = colors;
  // Upload new photo if selected
  var photoInput = document.getElementById('edit-photo-input');
  if (photoInput && photoInput._file) {
    try { m.photo = await uploadPhoto(photoInput._file, m.id); } catch(e) { console.error('Photo upload failed:', e); }
  }
  closeModal('modal-edit');
  render();
  try { await saveMaterial(m); } catch(e) { alert('Error saving: ' + e.message); }
}

// ── CSV ──
function exportCSV() {
  if (!transactions.length) { alert('No transactions yet.'); return; }
  var rows = [['Date','Time','Staff','Job Number','Material','SKU','Colour','Type','Quantity']];
  var mMap = {};
  materials.forEach(function(m){ mMap[m.id] = m.sku||''; });
  transactions.forEach(function(tx) {
    var d = new Date(tx.ts);
    rows.push([d.toLocaleDateString('en-AU'), d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'}), tx.staff||'', tx.job||'', tx.matName, mMap[tx.matId]||'', tx.colorName, tx.type==='collect'?'Collect':'Return', tx.qty]);
  });
  var csv = rows.map(function(r){ return r.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'jsj-stock-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

// ── INIT ──
document.getElementById('add-color-new-btn').addEventListener('click', function(){ addColorRow('color-entries'); });

async function init() {
  var overlay = document.getElementById('loading-overlay');
  overlay.style.display = 'flex';
  try {
    await loadAll();
    if (materials.length === 0) {
      for (var i = 0; i < SEED_MATERIALS.length; i++) {
        await saveMaterial(SEED_MATERIALS[i]);
      }
      await loadAll();
    }
    overlay.style.display = 'none';
    renderStaffScreen();
  } catch(e) {
    console.error('Load error:', e);
    overlay.innerHTML = '<div style="text-align:center;padding:20px;max-width:400px;">' +
      '<div style="font-size:48px;margin-bottom:16px;">⚠️</div>' +
      '<div style="font-family:Barlow Condensed,sans-serif;font-size:22px;font-weight:700;color:#dc2626;margin-bottom:12px;">Connection Failed</div>' +
      '<div style="font-size:14px;color:#4a5568;margin-bottom:16px;">Could not connect to the database.</div>' +
      '<div style="background:#fee2e2;border-radius:8px;padding:12px;font-size:12px;color:#b91c1c;text-align:left;margin-bottom:16px;word-break:break-all;">' + e.message + '</div>' +
      '<div style="font-size:13px;color:#4a5568;margin-bottom:16px;">Make sure RLS policies are set in Supabase:<br><br>' +
      '<code style="background:#f3f4f6;padding:4px 8px;border-radius:4px;font-size:11px;">create policy "Allow all" on materials for all using (true) with check (true);</code></div>' +
      '<button onclick="location.reload()" style="background:#0d52a5;color:white;border:none;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">Try Again</button>' +
      '</div>';
  }
}

init();
</script>
